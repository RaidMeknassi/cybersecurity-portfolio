<!DOCTYPE html>
<html lang="en" data-theme="matrix">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raid Meknassi | Senior Security Analyst</title>
  <meta name="description" content="Portfolio of Raid Meknassi, Senior Security Analyst at IBM in Budapest. Microsoft Sentinel, Defender, IBM QRadar, KQL and incident response." />
  <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="rain" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>

  <main class="screen" id="screen">
    <div id="boot" class="boot" aria-live="polite"></div>

    <header id="hero" class="hero" hidden>
      <img src="profile.jpg" alt="Raid Meknassi" class="avatar" width="96" height="96" />
      <h1 class="title" data-text="RAID MEKNASSI">RAID MEKNASSI</h1>
      <div class="subtitle">
        <span>SENIOR SECURITY ANALYST @ IBM</span>
        <span>BUDAPEST, HUNGARY</span>
        <span>Type <b>help</b> to list commands</span>
      </div>
    </header>

    <section id="output" class="output" aria-live="polite"></section>

    <div class="chips" id="chips" hidden>
      <button type="button" data-cmd="help">help</button>
      <button type="button" data-cmd="about">about</button>
      <button type="button" data-cmd="experience">experience</button>
      <button type="button" data-cmd="skills">skills</button>
      <button type="button" data-cmd="certs">certs</button>
      <button type="button" data-cmd="contact">contact</button>
      <button type="button" data-cmd="themes">themes</button>
    </div>

    <form id="prompt" class="prompt" autocomplete="off" hidden>
      <label for="cmd" class="ps1">guest@raid-meknassi:~$</label>
      <input id="cmd" type="text" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Terminal command" />
    </form>
  </main>

  <noscript>
    <div class="noscript">
      <h1>Raid Meknassi</h1>
      <p>Senior Security Analyst at IBM, Budapest, Hungary.</p>
      <p>Microsoft Sentinel, Microsoft Defender, IBM QRadar, KQL, incident response.</p>
      <p>
        <a href="mailto:raidrawda@gmail.com">raidrawda@gmail.com</a> |
        <a href="https://www.linkedin.com/in/raid-meknassi-70898b204/">LinkedIn</a> |
        <a href="https://github.com/RaidMeknassi">GitHub</a>
      </p>
      <p>Enable JavaScript to use the interactive terminal.</p>
    </div>
  </noscript>

  <script src="script.js"></script>
</body>
</html>
